upstream flask_app {
    # Shared memory zone: all nginx workers use one round-robin counter.
    # Without it each worker balances on its own and new connections keep hitting the first replica.
    zone flask_app 64k;
    # "app" is resolved by Docker's internal DNS at nginx startup; scaled replicas are load-balanced
    server app:5000;
}

server {
    listen 80;
    server_name _;

    # Nginx's own healthcheck, does not depend on the app
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://flask_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
